{% extends "base.html" %}
{% block content %}

<h2 class="section-title">Login</h2>

<form method="post" class="form-card">
    <input type="text" name="name" placeholder="Username..." required class="input-neon">
    <input type="password" name="password" placeholder="Password..." required class="input-neon">

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <button type="submit" class="btn-primary">Login</button>
</form>

{% endblock %}
